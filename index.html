<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Points Calculator — Guild Versus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #262626;
    color: #e5e5e5;
    min-height: 100vh;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .container { max-width: 900px; margin: 0 auto; }
  
  /* Language Switcher */
  .lang-switcher {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
    gap: 8px;
  }
  .lang-btn {
    padding: 6px 14px;
    background: #171717;
    border: 1px solid #404040;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #a3a3a3;
    transition: all 0.2s;
  }
  .lang-btn:hover { background: #262626; color: #e5e5e5; }
  .lang-btn.active {
    background: #f59e0b;
    color: #171717;
    border-color: #f59e0b;
  }

  h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 20px;
    color: #f59e0b;
    font-weight: 700;
  }
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 8px;
    background: #171717;
    border: 1px solid #404040;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #a3a3a3;
    transition: all 0.2s;
    user-select: none;
    text-align: center;
    min-width: 0;
    min-height: 42px;
    line-height: 1.2;
  }
  .tab:hover { background: #262626; color: #e5e5e5; }
  .tab.active {
    background: #f59e0b;
    color: #171717;
    border-color: #f59e0b;
  }
  .tab.today::after {
    content: "•";
    color: #84cc16;
    font-size: 18px;
    margin-left: 4px;
    line-height: 1;
  }
  .tab-full { display: inline; }
  .tab-short { display: none; }
  .day-panel {
    background: #171717;
    border: 1px solid #404040;
    border-radius: 12px;
    padding: 16px;
  }
  
  /* Анимации перелистывания */
  @keyframes slideInLeft {
    from {
      opacity: 0;
      transform: translateX(40px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
  @keyframes slideInRight {
    from {
      opacity: 0;
      transform: translateX(-40px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }
  .animate-slide-left {
    animation: slideInLeft 0.3s ease-out;
  }
  .animate-slide-right {
    animation: slideInRight 0.3s ease-out;
  }
  
  .task {
    display: grid;
    grid-template-columns: 1fr 100px 90px 110px;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    margin-bottom: 8px;
    background: #0a0a0a;
    border-left: 3px solid #f59e0b;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .task:hover { background: #141414; }
  .task-name { font-size: 15px; line-height: 1.4; color: #e5e5e5; }
  .task-pts {
    text-align: right;
    font-weight: 600;
    color: #f59e0b;
    font-size: 13px;
    white-space: nowrap;
  }
  .task-pts small { color: #a3a3a3; font-weight: 400; font-size: 11px; }
  .task-input {
    width: 100%;
    padding: 10px;
    background: #0a0a0a;
    border: 1px solid #404040;
    border-radius: 6px;
    color: #e5e5e5;
    font-size: 16px;
    text-align: center;
    font-weight: 600;
    -moz-appearance: textfield;
    min-height: 44px;
  }
  .task-input::-webkit-outer-spin-button,
  .task-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .task-input:focus {
    outline: none;
    border-color: #f59e0b;
    box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
  }
  .task-earned {
    text-align: right;
    font-weight: 700;
    color: #2dd4bf;
    font-size: 14px;
    white-space: nowrap;
  }
  .total-bar {
    margin-top: 20px;
    padding: 20px;
    background: #171717;
    border: 2px solid #f59e0b;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .total-label { font-size: 18px; font-weight: 600; color: #e5e5e5; }
  .total-value {
    font-size: 32px;
    font-weight: 800;
    color: #2dd4bf;
  }
  .reset-btn {
    padding: 12px 22px;
    background: #ef4444;
    border: 1px solid #ef4444;
    color: #ffffff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    min-height: 44px;
  }
  .reset-btn:hover { background: #dc2626; }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: #a3a3a3;
    font-size: 16px;
  }

  /* Мобильная версия */
  @media (max-width: 640px) {
    .lang-switcher { justify-content: center; }
    .lang-btn { padding: 5px 12px; font-size: 12px; }
    body { padding: 10px; }
    h1 { font-size: 22px; margin-bottom: 14px; }
    .tabs { gap: 4px; margin-bottom: 14px; }
    .tab { padding: 9px 4px; font-size: 12px; min-height: 38px; }
    .tab-full { display: none; }
    .tab-short { display: inline; }
    .day-panel { padding: 10px; }
    .task {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .task-name { font-size: 14px; }
    .task-pts {
      text-align: left;
      font-size: 13px;
      padding-bottom: 4px;
      border-bottom: 1px solid #262626;
    }
    .task-bottom {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .task-input-wrap { flex: 1; }
    .task-input { min-height: 44px; font-size: 16px; }
    .task-earned {
      text-align: right;
      min-width: 80px;
      font-size: 15px;
    }
    .total-bar { padding: 16px; flex-direction: column; align-items: stretch; }
    .total-label { font-size: 16px; text-align: center; }
    .total-value { font-size: 28px; text-align: center; }
    .reset-btn { width: 100%; }
  }
</style>
</head>

const DAY_ORDER_RU = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"];
const DAY_ORDER_EN = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

let currentLang = localStorage.getItem('skhatka_lang') || 'ru';
let currentDay = translations[currentLang].days.full[new Date().getDay()];
if (!translations[currentLang].tasks[currentDay]) {
  currentDay = currentLang === 'ru' ? "Понедельник" : "Monday";
}

const inputs = {};
DAY_ORDER_RU.forEach(d => inputs[d] = new Array(translations.ru.tasks[d].length).fill(0));
DAY_ORDER_EN.forEach(d => inputs[d] = new Array(translations.en.tasks[d].length).fill(0));

// Swipe variables
let touchStartX = 0;
let touchEndX = 0;
const SWIPE_THRESHOLD = 50;

function handleTouchStart(e) {
  touchStartX = e.changedTouches[0].screenX;
}

function handleTouchEnd(e) {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}

function handleSwipe() {
  const swipeDistance = touchEndX - touchStartX;
  
  if (Math.abs(swipeDistance) < SWIPE_THRESHOLD) return;
  
  const dayOrder = currentLang === 'ru' ? DAY_ORDER_RU : DAY_ORDER_EN;
  const currentIndex = dayOrder.indexOf(currentDay);
  
  if (swipeDistance > 0) {
    // Свайп вправо - предыдущий день
    if (currentIndex > 0) {
      currentDay = dayOrder[currentIndex - 1];
      renderTabs();
      renderDay('right');
    }
  } else {
    // Свайп влево - следующий день
    if (currentIndex < dayOrder.length - 1) {
      currentDay = dayOrder[currentIndex + 1];
      renderTabs();
      renderDay('left');
    }
  }
}

function setLanguage(lang) {
  currentLang = lang;
  localStorage.setItem('skhatka_lang', lang);
  
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent.toLowerCase() === lang) {
      btn.classList.add('active');
    }
  });
  
  const todayIndex = new Date().getDay();
  currentDay = translations[lang].days.full[todayIndex];
  if (!translations[lang].tasks[currentDay]) {
    currentDay = lang === 'ru' ? "Понедельник" : "Monday";
  }
  
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (translations[lang][key]) {
      el.innerHTML = translations[lang][key];
    }
  });
  
  renderTabs();
  renderDay();
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  const t = translations[currentLang];
  const todayName = t.days.full[new Date().getDay()];
  const dayOrder = currentLang === 'ru' ? DAY_ORDER_RU : DAY_ORDER_EN;
  
  dayOrder.forEach((day, index) => {
    const shortName = t.days.short[index + 1];
    const tab = document.createElement("div");
    tab.className = "tab" + (day === currentDay ? " active" : "") + (day === todayName ? " today" : "");
    tab.innerHTML = `<span class="tab-full">${day}</span><span class="tab-short">${shortName}</span>`;
    tab.title = day;
    tab.onclick = () => { currentDay = day; renderTabs(); renderDay(); };
    tabsEl.appendChild(tab);
  });
}

function calcEarned(required, points, qty) {
  if (qty <= 0) return 0;
  return Math.floor((qty / required) * points);
}

function renderDay(direction) {
  const panel = document.getElementById("dayPanel");
  const t = translations[currentLang];
  const tasks = t.tasks[currentDay];
  
  // Сбросить предыдущую анимацию
  panel.classList.remove('animate-slide-left', 'animate-slide-right');
  
  if (!tasks) {
    panel.innerHTML = `<div class="empty">${t.noTasksSunday}</div>`;
    document.getElementById("totalValue").textContent = "0 " + t.points;
    return;
  }
  
  const dayOrder = currentLang === 'ru' ? DAY_ORDER_RU : DAY_ORDER_EN;
  const dayIndex = dayOrder.indexOf(currentDay);
  const inputsArray = inputs[currentDay] || inputs[DAY_ORDER_RU[dayIndex]] || [];
  
  panel.innerHTML = "";
  tasks.forEach((task, i) => {
    const [name, required, points] = task;
    const qty = inputsArray[i] || 0;
    const earned = calcEarned(required, points, qty);
    const row = document.createElement("div");
    row.className = "task";
    row.innerHTML = `
      <div class="task-name">${name}</div>
      <div class="task-pts">${points.toLocaleString('ru-RU')} <small>${t.points}</small></div>
      <div class="task-input-wrap">
        <input type="number" class="task-input" min="0" inputmode="numeric" value="${qty || ''}" placeholder="0" data-idx="${i}">
      </div>
      <div class="task-earned" data-idx="${i}">${earned > 0 ? earned.toLocaleString('ru-RU') + ' ' + t.earned : ''}</div>
    `;
    const input = row.querySelector("input");
    input.addEventListener("input", (e) => {
      const v = parseInt(e.target.value) || 0;
      inputsArray[i] = v;
      const earned = calcEarned(required, points, v);
      row.querySelector(".task-earned").textContent = earned > 0 ? earned.toLocaleString('ru-RU') + ' ' + t.earned : '';
      updateTotal();
    });
    panel.appendChild(row);
  });
  updateTotal();
  
  // Применить анимацию, если указано направление
  if (direction) {
    // Принудительный reflow для перезапуска анимации
    void panel.offsetWidth;
    panel.classList.add(direction === 'left' ? 'animate-slide-left' : 'animate-slide-right');
  }
  
  // Touch event listeners
  panel.removeEventListener('touchstart', handleTouchStart);
  panel.removeEventListener('touchend', handleTouchEnd);
  panel.addEventListener('touchstart', handleTouchStart, {passive: true});
  panel.addEventListener('touchend', handleTouchEnd, {passive: true});
}

function updateTotal() {
  const t = translations[currentLang];
  const tasks = t.tasks[currentDay] || [];
  const dayOrder = currentLang === 'ru' ? DAY_ORDER_RU : DAY_ORDER_EN;
  const dayIndex = dayOrder.indexOf(currentDay);
  const inputsArray = inputs[currentDay] || inputs[DAY_ORDER_RU[dayIndex]] || [];
  
  let total = 0;
  tasks.forEach((task, i) => {
    total += calcEarned(task[1], task[2], inputsArray[i] || 0);
  });
  document.getElementById("totalValue").textContent = total.toLocaleString('ru-RU') + " " + t.points;
}

function resetDay() {
  const t = translations[currentLang];
  if (!confirm(t.confirmReset + currentDay + "?")) return;
  
  const dayOrder = currentLang === 'ru' ? DAY_ORDER_RU : DAY_ORDER_EN;
  const dayIndex = dayOrder.indexOf(currentDay);
  const ruDay = DAY_ORDER_RU[dayIndex];
  inputs[ruDay] = new Array(translations.ru.tasks[ruDay].length).fill(0);
  inputs[currentDay] = new Array(tasks.length).fill(0);
  
  renderDay();
}

// Initialize
setLanguage(currentLang);
</script>
</body>
</html>
